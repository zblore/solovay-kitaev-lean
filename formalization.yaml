# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The Solovay-Kitaev theorem for Clifford+T words, with the Dawson-Nielsen exponent"
  description: >-
    A machine-checked proof of the Solovay-Kitaev theorem for single-qubit Clifford+T circuits.
    A word is a finite sequence of the letters H, T and T^-1 (with T^-1 = T^7), and its value
    is the product of the letters' 2 x 2 matrices. There are constants K > 0 and e > 0 such that
    for every epsilon with 0 < epsilon <= e, every U in SU(2) is within epsilon of the value of a
    word of length at most K log(1/epsilon)^c, in the operator norm, where
    c = log 5 / log(3/2), about 3.97, is Dawson and Nielsen's exponent. A second theorem places
    c strictly between 3 and 4. The word approximates U itself, not U up to a phase. K and e
    are not computed. The proof was first completed in the author's csd-lean4 library on
    6 October 2026 (commit 01e973e9). The theorem is classical and no priority is claimed for
    it.
  authors:
    - "Zayn Blore"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Zayn Blore"

repository:
  role: "substantive-development"

classification:
  arxiv: ["quant-ph", "math.GR"]
  msc2020: ["81P68", "81P65", "68Q12"]

sources:
  - title: "The Solovay-Kitaev algorithm"
    authors:
      - "Christopher M. Dawson"
      - "Michael A. Nielsen"
    id: "https://arxiv.org/abs/quant-ph/0505030"
    type: "paper"
    location: >-
      Quantum Information and Computation 6 (2006), 81; arXiv:quant-ph/0505030. Sections 3
      and 4, as cited by csd-lean4. Not read for this entry.
    relationship: "adapts"
    note: >-
      csd-lean4 cites this paper for the recursion it formalises: approximate U, write the
      residual as a balanced group commutator of two near-identity unitaries, approximate those
      one level down, and reassemble. One level uses five shorter words, which gives the
      exponent log 5 / log(3/2). The base case here is a finite net of Clifford+T words from
      compactness of SU(2) and density of the Clifford+T group, so K and e are not computed.
    author_endorsement: "n/a"
  - title: "Quantum computations: algorithms and error correction"
    authors:
      - "A. Yu. Kitaev"
    id: "https://doi.org/10.1070/RM1997v052n06ABEH002155"
    type: "paper"
    location: "Russian Mathematical Surveys 52 (1997), 1191-1249. Not read for this entry."
    relationship: "background"
    note: >-
      Kitaev outlined a proof in this review paper. Solovay had announced the result for SU(2)
      in 1995 without publishing a proof.
    author_endorsement: "n/a"
  - title: "Quantum Computation and Quantum Information"
    authors:
      - "Michael A. Nielsen"
      - "Isaac L. Chuang"
    id: "https://doi.org/10.1017/CBO9780511976667"
    type: "book"
    location: >-
      Cambridge University Press, 10th anniversary edition, 2010. Appendix 3, as cited by
      csd-lean4. Not read for this entry.
    relationship: "background"
    note: >-
      The textbook account of the Solovay-Kitaev theorem.
    author_endorsement: "n/a"

